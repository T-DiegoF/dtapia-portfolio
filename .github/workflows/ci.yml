name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deployment is handled by Vercel's own Git integration, which builds from
# the Angular preset and creates a preview for every pull request. This
# workflow only verifies; it never publishes.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Test
        run: npm test -- --no-watch

      - name: Build
        run: npm run build
