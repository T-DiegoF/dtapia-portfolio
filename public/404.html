<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>404 — Diego Tapia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    /* Self-contained: this page must render even if the app bundle never loads.
       Tokens mirror src/styles.css. */
    :root {
      --paper: #f2efe6;
      --ink: #14130e;
      --ink-2: #55524a;
      --ink-3: #6f6b5e;
      --rule: #d7d2c4;
      --accent: #b83f26;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --paper: #121110;
        --ink: #f2efe6;
        --ink-2: #a8a396;
        --ink-3: #8d8879;
        --rule: #2e2b26;
        --accent: #e5613f;
        color-scheme: dark;
      }
    }

    @font-face {
      font-family: 'Syne';
      font-style: normal;
      font-weight: 700 800;
      font-display: swap;
      src: url('/fonts/syne-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
    }

    @font-face {
      font-family: 'Fira Code';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/fonts/fira-code-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100dvh;
      display: grid;
      place-content: center;
      gap: 1.75rem;
      padding: clamp(1.5rem, 6vw, 5rem);
      background: var(--paper);
      color: var(--ink);
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.875rem;
      line-height: 1.7;
    }

    .code {
      font-family: 'Syne', 'Trebuchet MS', sans-serif;
      font-weight: 800;
      font-size: clamp(4.5rem, 20vw, 12rem);
      letter-spacing: -0.055em;
      line-height: 0.85;
    }

    .code span { color: var(--accent); }

    hr { height: 1px; border: 0; background: var(--rule); }

    p { max-width: 46ch; color: var(--ink-2); }

    .eyebrow {
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    a:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>

<body>
  <p class="eyebrow">Diego Tapia &middot; Buenos Aires</p>
  <h1 class="code">4<span>0</span>4</h1>
  <hr />
  <p>That page does not exist. Nothing here is routed — the portfolio is a single page.</p>
  <p><a href="/">&larr;&nbsp; Back to the portfolio</a></p>
</body>
</html>
