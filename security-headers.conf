# nginx does not merge `add_header` across levels: a location block that sets
# any header of its own drops every one inherited from the server block. So
# these are included explicitly wherever a location adds its own headers,
# rather than declared once at the top.
add_header X-Content-Type-Options      "nosniff"                                                     always;
add_header Referrer-Policy             "strict-origin-when-cross-origin"                             always;
add_header X-Frame-Options             "SAMEORIGIN"                                                  always;
add_header Cross-Origin-Opener-Policy  "same-origin"                                                 always;
add_header Permissions-Policy          "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
# Harmless over plain HTTP (browsers ignore it); active once behind TLS.
add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains"                         always;
