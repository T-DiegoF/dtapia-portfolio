server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    include /etc/nginx/security-headers.conf;

    # Hashed build assets are immutable.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys land immediately.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The app has no client-side router, so there is nothing to fall back for.
    # A catch-all rewrite to index.html would answer every made-up URL with the
    # homepage and a 200 — a soft 404 that search engines index as duplicate
    # content. Unknown paths get a real 404 instead.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;
}
